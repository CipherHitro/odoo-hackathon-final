[project]
name = "backend"
version = "0.1.0"
description = "One final shot at Odoo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "resend[async]>=2.43.0",
    "sqlalchemy>=2.0.52",
]

# Explicit entrypoint for the FastAPI CLI (`uv run fastapi dev` / `uv run fastapi run`)
[tool.fastapi]
entrypoint = "main:app"
